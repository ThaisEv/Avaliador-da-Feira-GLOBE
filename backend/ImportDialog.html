<!doctype html><html><head><base target="_top"><style>body{font:14px Arial,sans-serif;color:#173b36;padding:16px}h2{color:#073b3a;margin-top:0}label{display:block;margin:16px 0 6px;font-weight:bold}input{width:100%;padding:8px;box-sizing:border-box}button{background:#073b3a;color:#fff;border:0;border-radius:6px;padding:11px 16px;margin-top:18px;cursor:pointer}button:disabled{opacity:.55}#status{margin-top:14px;white-space:pre-wrap;line-height:1.5}.hint{color:#5e716b;font-size:12px;line-height:1.5}</style></head><body><h2>Importar dados oficiais</h2><p class="hint">Selecione os arquivos <b>data/trabalhos.json</b> e <b>data/criterios.json</b> gerados pelo importador. A rotina adiciona IDs ausentes e mantém os trabalhos que já estiverem cadastrados.</p><label for="works">Trabalhos (134 registros)</label><input id="works" type="file" accept="application/json,.json"><label for="criteria">Critérios (7 itens)</label><input id="criteria" type="file" accept="application/json,.json"><button id="import" onclick="importFiles()">Importar cadastro</button><div id="status" role="status"></div><script>
function readFile(input){return new Promise((resolve,reject)=>{if(!input.files.length){reject(new Error('Selecione os dois arquivos JSON.'));return;}const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).replace(/^\uFEFF/,''));reader.onerror=()=>reject(new Error('Não foi possível ler um dos arquivos.'));reader.readAsText(input.files[0],'UTF-8');});}
function parseJson(text,label){try{return JSON.parse(String(text).replace(/^\uFEFF/,''));}catch(_){throw new Error('O arquivo '+label+' não é um JSON válido. Gere novamente com npm run import:data.');}}
async function importFiles(){const button=document.getElementById('import'),status=document.getElementById('status');button.disabled=true;status.textContent='Lendo arquivos…';try{const worksText=await readFile(document.getElementById('works')),criteriaText=await readFile(document.getElementById('criteria'));const works=parseJson(worksText,'de trabalhos'),criteria=parseJson(criteriaText,'de critérios');status.textContent='Validando os 134 trabalhos e os sete critérios…';google.script.run.withSuccessHandler(result=>{status.textContent=`Importação concluída.\nTrabalhos adicionados: ${result.worksAdded}\nTrabalhos já existentes mantidos: ${result.worksSkipped}\nCritérios adicionados: ${result.criteriaAdded}\nCritérios já existentes mantidos: ${result.criteriaSkipped}`;button.disabled=false;}).withFailureHandler(error=>{status.textContent='Não foi possível importar: '+String(error.message||'Erro no Apps Script.').slice(0,400);button.disabled=false;}).importOfficialCatalog(JSON.stringify(works),JSON.stringify(criteria));}catch(error){status.textContent=error.message;button.disabled=false;}}
</script></body></html>
